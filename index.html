// every query the database answers is filtered to auth.uid(). If this file ever asked for
// all trips, Postgres would still hand back only the signed-in user's.

// takes the whole module down with it — a blank site. This way, if esm.sh is unreachable,
// accounts quietly stop working and the app still plans trips on this device.

    } catch (e) { return "Could not reach the account service."; }
  };
  // Called after the emailed link has signed them in on a temporary recovery session.
  const doSetPassword = async (password) => {
    const sb = await supa();
    if (!sb) return "Accounts are unavailable just now.";
    try {
      const r = await sb.auth.updateUser({ password });
      return r.error ? r.error.message : "";
    } catch (e) { return "Could not reach the account service."; }
  };
  const doSignOut = async () => {
    const sb = await supa();
    if (sb) { try { await sb.auth.signOut(); } catch (e) {} }
    blankTrip(); setTripId(null); setScreen("landing");
  };
  // Copy this browser's journeys into the account. Each gets a fresh id, and only the ones
  // that copy successfully are cleared locally — a half-finished migration must not lose a trip.
  const doMigrate = async () => {
    if (migrating) return;
    setMigrating(true);
    const list = readIndex();
    let moved = 0;
    for (const e of list) {
      if (!e || !e.id) continue;
      const body = readTrip(e.id);
      if (!body) continue;
      const id = newTripId();
      const ok = await cloudWrite(id, user.id, body, e.where || "");
      if (ok) { forgetTrip(e.id); moved += 1; }
    }
    const fresh = await cloudList();
    if (fresh) setTrips(fresh);
    setMigratable(readIndex());
    setMigrating(false);
    if (moved === 0) setCloudErr("Those journeys could not be copied just now. They are still saved on this device.");
  };

  const shared = { user, authReady, onOpenAuth: () => setAuthPanel(true), onSignOut: doSignOut, step, setStep, dates, setDates, travelers, setTravelers, fromCity, setFromCity, homeCity, setHomeCity, tripName, setTripName, dests, setDest, addDest, addIdeas, removeDest, moveDest, moveDestToEnd, stale, startOver, undo, setUndo, returnFrom, setReturnFrom, returnMode, setReturnMode, returnPick, setReturnPick, saved, onHome: () => { setScreen("landing"); setStep(0); }, onItinerary: () => setScreen("itinerary") };

  return (<div style={{ minHeight: "100vh", background: t.paper, color: t.ink, fontFamily: font.ui }}>
    <FontStyles />
    {screen === "landing" && <Landing trips={trips} onOpen={openTrip} onBegin={beginTrip} onDelete={removeTrip} canSave={canSave} stale={stale}
      user={user} authReady={authReady} cloudErr={cloudErr} onSignOut={doSignOut} onOpenAuth={() => setAuthPanel(true)}
      migratable={migratable} migrating={migrating} onMigrate={doMigrate} />}
    {screen === "start" && <StartChooser onKnow={() => setScreen("plan")} onOpen={() => { addIdeas(); setScreen("plan"); }} onInspire={() => setScreen("oneList")} onHome={() => { setScreen("landing"); setStep(0); }} />}
    {screen === "oneList" && <OneList onPick={seedFromEvent} onBack={() => setScreen("start")} onHome={() => { setScreen("landing"); setStep(0); }} />}
    {screen === "plan" && <Planner {...shared} />}
    {screen === "itinerary" && <ItineraryView {...shared} onEdit={() => setScreen("plan")} />}
    {recovery && (<div style={{ position: "fixed", inset: 0, zIndex: 95, background: "rgba(34,29,25,.42)", display: "grid", placeItems: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 420, display: "flex" }}>
        <NewPasswordPanel onSet={doSetPassword} onDone={() => { setRecovery(false); setAuthPanel(false); }} />
      </div>
    </div>)}
    {authPanel && !user && !recovery && (<div onClick={() => setAuthPanel(false)} style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(34,29,25,.42)", display: "grid", placeItems: "center", padding: 20 }}>
      <div onClick={(ev) => ev.stopPropagation()} style={{ width: "100%", maxWidth: 420, display: "flex" }}>
        <AccountPanel onSignIn={doSignIn} onSignUp={doSignUp} onReset={doReset} onClose={() => setAuthPanel(false)} />
      </div>
    </div>)}
  </div>);
}

// Small, quiet, and on every screen — so the option is always to hand without ever being
// the thing in your way.
function SignInBadge({ user, authReady, onOpen, onSignOut }) {
  if (!authReady) return null;
  const base = { background: "none", border: `1px solid ${t.line}`, borderRadius: 999, padding: "7px 15px", fontSize: 12.5, fontFamily: font.ui, cursor: "pointer" };
  if (user) return (<button onClick={onSignOut} title={user.email} style={{ ...base, color: t.inkFaint }}>Sign out</button>);
  return (<button onClick={onOpen} style={{ ...base, color: t.ink }}>Sign in</button>);
}

// The larger ask, and it only appears once there is something worth keeping — at the end of
// the build and on the finished itinerary. Asking before a client has built anything is how
// you lose them at the door; asking after they have spent an hour on it is a favour.
function SaveJourneyPrompt({ onOpen }) {
  return (<div className="vo-noprint" style={{ marginTop: 40, background: t.card, border: `1px solid ${t.brassLight}`, borderRadius: 18, padding: "28px 28px 26px", display: "flex", flexDirection: "column", gap: 14, alignItems: "flex-start" }}>
    <div style={{ fontFamily: font.display, fontSize: 28, lineHeight: 1.12 }}>Keep this journey</div>
    <div style={{ fontSize: 14.5, color: t.inkSoft, lineHeight: 1.55, maxWidth: 540 }}>It is saved on this device for now. Add a password to your email and it will be waiting on your phone, your tablet and your desk — and it will still be here if this browser is ever cleared.</div>
    <button onClick={onOpen} style={{ background: t.pine, color: t.paper, border: "none", borderRadius: 999, padding: "15px 32px", fontSize: 15, letterSpacing: "0.04em", display: "flex", alignItems: "center", gap: 10 }}>Save my journeys <ArrowRight size={16} /></button>
  </div>);
}

// Shown when someone arrives from a reset email. They are technically signed in at this
// point, on a short-lived recovery session — but the only useful thing to do with it is
// choose a new password, so we ask for that rather than dropping them into the app.
function NewPasswordPanel({ onSet, onDone }) {
  const [pw, setPw] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const box = { fontFamily: font.ui, fontSize: 15.5, color: t.ink, background: t.white, border: `1px solid ${t.line}`, borderRadius: 12, padding: "13px 14px", outline: "none", width: "100%", boxSizing: "border-box" };
  const submit = async () => {
    if (busy) return;
    setMsg("");
    if (pw.length < 8) { setMsg("Please choose a password of at least eight characters."); return; }
    setBusy(true);
    const err = await onSet(pw);
    setBusy(false);
    if (err) setMsg(err); else onDone();
  };
  return (<div style={{ width: "100%", maxWidth: 420, background: t.card, border: `1px solid ${t.line}`, borderRadius: 16, padding: "22px 22px 20px", textAlign: "left", display: "flex", flexDirection: "column", gap: 13 }}>
    <div style={{ fontFamily: font.display, fontSize: 23, lineHeight: 1.15 }}>Choose a new password</div>
    <div style={{ fontSize: 13, color: t.inkFaint, lineHeight: 1.45 }}>Eight characters or more. Use Show to check it before you save it.</div>
    <div style={{ position: "relative", width: "100%" }}>
      <input type={showPw ? "text" : "password"} autoComplete="new-password" autoCapitalize="none" autoCorrect="off" spellCheck={false} placeholder="New password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") submit(); }} style={{ ...box, paddingRight: 62 }} />
      <button type="button" onClick={() => setShowPw(!showPw)} aria-label={showPw ? "Hide password" : "Show password"} style={{ position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: t.pineSoft, fontSize: 12.5, fontFamily: font.ui, letterSpacing: "0.04em", padding: "8px 10px", cursor: "pointer" }}>{showPw ? "Hide" : "Show"}</button>
    </div>
    {msg && <div style={{ fontSize: 13, color: t.brass, lineHeight: 1.5 }}>{msg}</div>}
    <button onClick={submit} disabled={busy} style={{ background: t.pine, color: t.paper, border: "none", borderRadius: 999, padding: "14px 28px", fontSize: 15, letterSpacing: "0.04em", opacity: busy ? 0.6 : 1 }}>{busy ? "One moment…" : "Save new password"}</button>
  </div>);
}

// The sign-in card. Deliberately one field set with a mode switch rather than two screens:
// people mistype an address far less often when the box does not move under them.
function AccountPanel({ onSignIn, onSignUp, onReset, onClose }) {
  const [mode, setMode] = useState("in");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [note, setNote] = useState("");
  // A password you cannot see is a password you cannot be sure you typed — and on an iPad
  // keyboard, autocapitalise and fat fingers make that a real risk, not a theoretical one.
  const [showPw, setShowPw] = useState(false);
  const submit = async () => {
    if (busy) return;
    setMsg(""); setNote("");
    if (!email.trim()) { setMsg("An email address is needed."); return; }
    if (mode !== "forgot" && !pw) { setMsg("A password is needed too."); return; }
    if (mode === "up" && pw.length < 8) { setMsg("Please choose a password of at least eight characters."); return; }
    if (mode === "forgot") {
      setBusy(true);
      const err = await onReset(email);
      setBusy(false);
      if (err) setMsg(err);
      else setNote("If an account exists for " + email.trim() + ", a link to set a new password is on its way. It expires in an hour.");
      return;
    }
    setBusy(true);
    if (mode === "in") {
      const err = await onSignIn(email, pw);
      setBusy(false);
      if (err) setMsg(err); else { setPw(""); onClose(); }
    } else {
      const r = await onSignUp(email, pw);
      setBusy(false);
      if (r.err) { setMsg(r.err); return; }
      setPw("");
      if (r.confirm) setNote("Almost there — open the email just sent to " + email.trim() + " and follow the link to confirm this address. Then sign in.");
      else onClose();
    }
  };
  const box = { fontFamily: font.ui, fontSize: 15.5, color: t.ink, background: t.white, border: `1px solid ${t.line}`, borderRadius: 12, padding: "13px 14px", outline: "none", width: "100%", boxSizing: "border-box" };
  return (<div style={{ width: "100%", maxWidth: 420, background: t.card, border: `1px solid ${t.line}`, borderRadius: 16, padding: "22px 22px 20px", textAlign: "left", display: "flex", flexDirection: "column", gap: 13 }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
      <div>
        <div style={{ fontFamily: font.display, fontSize: 23, lineHeight: 1.15 }}>{mode === "in" ? "Sign in" : mode === "forgot" ? "Set a new password" : "Keep your journeys"}</div>
        <div style={{ fontSize: 13, color: t.inkFaint, marginTop: 4, lineHeight: 1.45 }}>{mode === "in" ? "Your journeys, on every device you use." : mode === "forgot" ? "Tell us the address you signed up with and we will send you a link." : "Only if you would like them saved. You are welcome to plan an entire trip first and decide later — nothing here is locked."}</div>
      </div>
      <button onClick={onClose} aria-label="Close" style={{ background: "none", border: "none", color: t.inkFaint, padding: 4, cursor: "pointer", lineHeight: 0 }}><X size={17} /></button>
    </div>
    {/* Said plainly and above the fields, because the moment someone is asked for an email is
        the moment they decide what kind of place this is. Purpose, not pledges — a promise
        never to write to them would be a door closed on the day she has something worth sending. */}
    <div style={{ fontSize: 12.5, color: t.inkSoft, lineHeight: 1.5, background: t.white, border: `1px solid ${t.line}`, borderRadius: 12, padding: "12px 14px" }}>
      Just an email and a password — enough for your journeys to find you again, wherever you sign in.
    </div>
    <input type="email" autoComplete="email" inputMode="email" autoCapitalize="none" autoCorrect="off" placeholder="Email address" value={email} onChange={(e) => setEmail(e.target.value)} style={box} />
    {mode !== "forgot" && <div style={{ position: "relative", width: "100%" }}>
      <input type={showPw ? "text" : "password"} autoComplete={mode === "in" ? "current-password" : "new-password"} autoCapitalize="none" autoCorrect="off" spellCheck={false} placeholder="Password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") submit(); }} style={{ ...box, paddingRight: 62 }} />
      <button type="button" onClick={() => setShowPw(!showPw)} aria-label={showPw ? "Hide password" : "Show password"} style={{ position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: t.pineSoft, fontSize: 12.5, fontFamily: font.ui, letterSpacing: "0.04em", padding: "8px 10px", cursor: "pointer" }}>{showPw ? "Hide" : "Show"}</button>
    </div>}
    {msg && <div style={{ fontSize: 13, color: t.brass, lineHeight: 1.5 }}>{msg}</div>}
    {note && <div style={{ fontSize: 13, color: t.pine, lineHeight: 1.5 }}>{note}</div>}
    <button onClick={submit} disabled={busy} style={{ background: t.pine, color: t.paper, border: "none", borderRadius: 999, padding: "14px 28px", fontSize: 15, letterSpacing: "0.04em", opacity: busy ? 0.6 : 1 }}>
      {busy ? "One moment…" : mode === "in" ? "Sign in" : mode === "forgot" ? "Email me a link" : "Save my journeys"}
    </button>
    <button onClick={() => { setMode(mode === "up" ? "in" : mode === "forgot" ? "in" : "up"); setMsg(""); setNote(""); }} style={{ background: "none", border: "none", color: t.pineSoft, fontSize: 13.5, textDecoration: "underline", padding: 2, cursor: "pointer" }}>
      {mode === "in" ? "I have not set a password yet" : "I already have an account"}
    </button>
    {mode === "in" && <button onClick={() => { setMode("forgot"); setMsg(""); setNote(""); setPw(""); }} style={{ background: "none", border: "none", color: t.inkFaint, fontSize: 12.5, textDecoration: "underline", padding: 2, cursor: "pointer" }}>
      I have forgotten my password
    </button>}
  </div>);
}

function Landing({ trips, onOpen, onBegin, onDelete, canSave, stale, user, authReady, cloudErr, onSignOut, onOpenAuth, migratable, migrating, onMigrate }) {

    <header style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "26px clamp(24px,5vw,64px)", gap: 16, flexWrap: "wrap" }}>
      <div style={{ fontFamily: font.display, fontSize: 22 }}>Voyage<span style={{ color: t.brass }}> One</span></div>
      <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
        {authReady && user && (<>
          <span style={{ fontSize: 12.5, color: t.inkFaint, maxWidth: 190, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{user.email}</span>
          <button onClick={onSignOut} style={{ background: "none", border: `1px solid ${t.line}`, borderRadius: 999, padding: "8px 16px", color: t.ink, fontSize: 13, fontFamily: font.ui, cursor: "pointer" }}>Sign out</button>
        </>)}

          <button onClick={onOpenAuth} style={{ background: "none", border: `1px solid ${t.line}`, borderRadius: 999, padding: "8px 18px", color: t.ink, fontSize: 13, fontFamily: font.ui, cursor: "pointer" }}>Sign in</button>
          {/* The button alone reads as housekeeping. The line under it is what tells someone

          <span style={{ fontSize: 11.5, color: t.inkFaint, lineHeight: 1.3, textAlign: "right" }}>Sign in to save your journey</span>

      </div>
    </header>
    <main style={{ flex: 1, display: "grid", placeItems: "center", padding: "0 clamp(24px,5vw,64px)" }}>

        <Eyebrow>Voyage One</Eyebrow>
        <h1 style={{ fontFamily: font.display, fontWeight: 400, margin: 0, fontSize: "clamp(44px,8vw,88px)", lineHeight: 1.02 }}>Let’s plan<br />your journey.</h1>

        {cloudErr && <div style={{ fontSize: 12.5, color: t.brass, maxWidth: 460, lineHeight: 1.5 }}>{cloudErr}</div>}
        {canMigrate && <div style={{ width: "100%", maxWidth: 520, background: t.card, border: `1px solid ${t.brassLight}`, borderRadius: 14, padding: "16px 18px", textAlign: "left", display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ fontSize: 13.5, color: t.inkSoft, lineHeight: 1.5 }}>{migratable.length === 1 ? "One journey is saved on this device and is not yet in your account." : `${migratable.length} journeys are saved on this device and are not yet in your account.`}</div>
          <button onClick={onMigrate} disabled={migrating} style={{ alignSelf: "flex-start", background: t.pine, color: t.paper, border: "none", borderRadius: 999, padding: "11px 22px", fontSize: 13.5, letterSpacing: "0.04em", opacity: migrating ? 0.6 : 1 }}>{migrating ? "Copying…" : "Add them to my account"}</button>
        </div>}
        {has && <div style={{ width: "100%", maxWidth: 520, display: "flex", flexDirection: "column", gap: 10 }}>
          <Eyebrow color={t.inkFaint}>Your journeys</Eyebrow>

            <button onClick={() => onOpen(e.id)} style={{ flex: 1, background: "none", border: "none", padding: 0, textAlign: "left", cursor: "pointer" }}>

            </button>
            <button onClick={() => onDelete(e.id)} aria-label="Delete journey" style={{ background: "none", border: "none", color: t.inkFaint, padding: 6, cursor: "pointer", lineHeight: 0 }}><X size={16} /></button>
          </div>))}
        </div>}
        {stale && <div style={{ fontSize: 12.5, color: t.brass, maxWidth: 460, lineHeight: 1.5 }}>One of these journeys was saved by an earlier version of Voyage One and cannot be opened safely. Begin a new one.</div>}
        <div style={{ marginTop: 4, display: "flex", gap: 14, flexWrap: "wrap", justifyContent: "center" }}>
          <button onClick={onBegin} style={{ background: t.pine, color: t.paper, border: "none", borderRadius: 999, padding: "16px 38px", fontSize: 15, letterSpacing: "0.04em", display: "flex", alignItems: "center", gap: 10 }}>{has ? "Begin another journey" : "Begin your journey"} <ArrowRight size={17} /></button>
        </div>
        {!canSave && !user && <div style={{ fontSize: 12.5, color: t.brass, maxWidth: 460, lineHeight: 1.5 }}>This browser will not let Voyage One save journeys — private browsing usually causes this. You can still plan a trip, but it will not be here when you come back.</div>}
        {user && <div style={{ fontSize: 12.5, color: t.inkFaint, marginTop: -8, lineHeight: 1.5 }}>Journeys are saved to your account, on every device you sign in from.</div>}
        {!user && canSave && <div style={{ fontSize: 12.5, color: t.inkFaint, marginTop: -8, maxWidth: 460, lineHeight: 1.5 }}>Journeys are saved on this device. Add a password to your email and they will follow you to your phone, tablet and desk.</div>}
      </div>
    </main>
    <footer style={{ padding: "22px", display: "flex", gap: 26, justifyContent: "center", flexWrap: "wrap", color: t.inkFaint, fontSize: 12, letterSpacing: "0.14em", textTransform: "uppercase" }}>{LEVELS.map((l) => <span key={l}>{l}</span>)}<span style={{ opacity: 0.5 }}>Build&nbsp;2★</span></footer>
  </div>);
}

function Planner(p) {
  useGeoTick(); // advisory notes and totals depend on distances that may resolve late
  useEffect(() => { if (typeof window !== "undefined") window.scrollTo(0, 0); }, [p.step]);
  const steps = ["Basics", "Departure", "Destinations", "Build"];
  const wrap = { maxWidth: p.step === 3 ? 1120 : 920, margin: "0 auto", padding: p.step === 3 ? "28px clamp(20px,5vw,48px) 150px" : "28px clamp(20px,5vw,48px) 120px" };
  return (<div className="vo-fade">
    <header style={{ position: "sticky", top: 0, zIndex: 20, background: t.paper, borderBottom: `1px solid ${t.line}`, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px clamp(20px,5vw,48px)" }}>
      <button onClick={p.onHome} style={{ background: "none", border: "none", fontFamily: font.display, fontSize: 20, color: t.ink }}>Voyage<span style={{ color: t.brass }}> One</span></button>
      {/* Step navigation belongs up here, not only at the foot of the page. The Build step runs
          to several thousand pixels, so a Back button at the bottom may as well not exist — and
          the browser's own back button leaves the site entirely. Someone who reaches the flights
          and dislikes the connections wants to change the departure city, not start again. */}
      <div style={{ display: "flex", alignItems: "center", gap: 3, flexWrap: "wrap" }}>
        <button onClick={() => p.setStep(Math.max(0, p.step - 1))} disabled={p.step === 0} aria-label="Back a step"
          style={{ background: "none", border: "none", padding: "6px 8px", color: p.step === 0 ? t.line : t.ink, cursor: p.step === 0 ? "default" : "pointer", display: "flex", alignItems: "center" }}><ArrowLeft size={16} /></button>
        {steps.map((s, i) => (
          // Only steps already reached are clickable — jumping ahead to Build before there is a
          // destination produces an empty page and looks broken.
          <button key={s} onClick={() => { if (i <= p.step) p.setStep(i); }} disabled={i > p.step}
            style={{ background: i === p.step ? t.card : "none", border: "none", borderRadius: 999, padding: "6px 11px", fontFamily: font.ui,
              fontSize: 11.5, letterSpacing: "0.1em", textTransform: "uppercase", cursor: i <= p.step ? "pointer" : "default",
              color: i === p.step ? t.ink : i < p.step ? t.pineSoft : t.line }}>{s}</button>
        ))}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        {p.saved && <span style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: t.pineSoft, display: "flex", alignItems: "center", gap: 5 }}><Check size={13} /> {p.user ? "Saved to your account" : "Auto-saved here"}</span>}
        <button onClick={() => { if (typeof window === "undefined" || window.confirm("Begin a new journey? This one stays saved on your list.")) p.startOver(); }} style={{ background: t.pine, border: `1px solid ${t.pine}`, borderRadius: 999, padding: "11px 22px", color: t.white, fontSize: 14, letterSpacing: "0.06em", fontWeight: 600, fontFamily: font.ui }}>Start over</button>
        <SignInBadge user={p.user} authReady={p.authReady} onOpen={p.onOpenAuth} onSignOut={p.onSignOut} />
        <div style={{ display: "flex", gap: 6 }}>{steps.map((s, i) => <span key={s} style={{ width: i === p.step ? 22 : 8, height: 8, borderRadius: 999, background: i <= p.step ? t.pine : t.line, transition: "all .25s" }} />)}</div>
      </div>
    </header>
    <div style={wrap}>
      {p.undo && (<div style={{ position: "fixed", left: 18, bottom: 92, zIndex: 60, background: t.ink, color: t.paper, borderRadius: 999, padding: "11px 12px 11px 18px", display: "flex", alignItems: "center", gap: 14, boxShadow: "0 8px 26px rgba(34,29,25,.28)" }}>
        <span style={{ fontSize: 13.5 }}>{p.undo.label}</span>
        <button onClick={() => { p.undo.restore(); p.setUndo(null); }} style={{ background: t.paper, color: t.ink, border: "none", borderRadius: 999, padding: "7px 15px", fontSize: 12.5, letterSpacing: "0.06em" }}>Undo</button>
        <button onClick={() => p.setUndo(null)} style={{ background: "none", border: "none", color: "rgba(251,250,246,.6)", display: "grid", placeItems: "center" }}><X size={15} /></button>
      </div>)}
      {p.stale && (<div style={{ display: "flex", gap: 10, alignItems: "flex-start", background: t.card, border: `1px solid ${t.brassLight}`, borderRadius: 14, padding: "14px 16px", marginBottom: 20 }}>
        <AlertTriangle size={16} color={t.brass} style={{ marginTop: 2, flexShrink: 0 }} />
        <div style={{ fontSize: 13.5, color: t.inkSoft, lineHeight: 1.5 }}>A trip saved by an earlier version was found. The app has changed since, so loading it would scramble your cities — it has been set aside and you are starting fresh.</div>
      </div>)}
      {p.step === 0 && <StepBasics {...p} />}
      {p.step === 1 && <StepDeparture {...p} />}
      {p.step === 2 && <StepDestinations {...p} />}
      {p.step === 3 && <StepBuild {...p} />}
      {p.step === 3 && !p.user && <SaveJourneyPrompt onOpen={p.onOpenAuth} />}
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 44 }}>
        <button onClick={() => p.setStep(Math.max(0, p.step - 1))} style={{ visibility: p.step === 0 ? "hidden" : "visible", background: "none", border: `1px solid ${t.line}`, borderRadius: 999, padding: "13px 24px", color: t.ink, display: "flex", alignItems: "center", gap: 8 }}><ArrowLeft size={16} /> Back</button>
        {p.step < 3 && <button onClick={() => p.setStep(p.step + 1)} style={{ background: t.pine, color: t.paper, border: "none", borderRadius: 999, padding: "13px 30px", display: "flex", alignItems: "center", gap: 8 }}>{p.step === 2 ? "Start building" : "Continue"} <ArrowRight size={16} /></button>}
      </div>
    </div>
  </div>);
}

  return (<div><SectionHead eyebrow="First" title="The essentials" sub="Your dates and who’s traveling. Your names will head up the finished itinerary." />
    <div style={{ display: "flex", flexWrap: "wrap", gap: 40, maxWidth: 560 }}>
      {[["Leaving home", "depart"], ["Home again", "ret"]].map(([lab, key]) => (<div key={key} style={{ flex: "1 1 200px", display: "flex", flexDirection: "column", gap: 7 }}>
        <span style={{ fontSize: 12, letterSpacing: "0.16em", textTransform: "uppercase", color: t.inkFaint, display: "flex", alignItems: "center", gap: 7 }}><Calendar size={13} /> {lab}</span>
        <input type="date" value={p.dates[key]} onChange={(e) => p.setDates({ ...p.dates, [key]: e.target.value })} style={{ fontFamily: font.display, fontSize: 22, color: t.ink, background: "none", border: "none", borderBottom: `1px solid ${t.line}`, padding: "8px 2px", outline: "none" }} />
      </div>))}
    </div>
    <div style={{ marginTop: 40 }}>
      <Eyebrow>Who’s traveling</Eyebrow>
      <div style={{ display: "flex", flexDirection: "column", gap: 18, marginTop: 16, maxWidth: 560 }}>
        {p.travelers.map((tr, i) => (<div key={i} style={{ display: "flex", gap: 18, alignItems: "flex-end" }}>
          <div style={{ flex: 1 }}><Field label={i === 0 ? "First name" : `Passenger ${i + 1} · first`} value={tr.first} onChange={(v) => setTrav(i, { first: v })} placeholder="First" big={false} /></div>
          <div style={{ flex: 1 }}><Field label="Last name" value={tr.last} onChange={(v) => setTrav(i, { last: v })} placeholder="Last" big={false} /></div>
          {i > 0 && <button onClick={() => removeTrav(i)} style={{ background: "none", border: "none", color: t.inkFaint, paddingBottom: 8 }}><X size={18} /></button>}
        </div>))}
      </div>
      <button onClick={addTrav} style={{ marginTop: 18, display: "flex", alignItems: "center", gap: 8, background: "none", border: `1px dashed ${t.brassLight}`, borderRadius: 12, padding: "12px 18px", color: t.pine, fontSize: 13.5 }}><Plus size={15} /> Add a passenger</button>
      {nameLine(p.travelers) !== "your journey" && <div style={{ marginTop: 18, fontFamily: font.display, fontSize: 20, color: t.pine }}>Curated for {nameLine(p.travelers)}</div>}
    </div>
  </div>);
}
function StepDeparture(p) {
  return (<div><SectionHead eyebrow="Next" title="Where are you departing from?" sub="The city you fly out of. You’ll set your landing-home city near the end — it can be different." />
    <div style={{ maxWidth: 440 }}><LabeledCity label="Departure city" value={p.fromCity} onChange={p.setFromCity} placeholder="Start typing a city" /></div></div>);
}
function StepDestinations(p) {
  return (<div><SectionHead eyebrow="Your itinerary" title={p.dests.length ? "Where to next?" : "Your first destination"} sub="Name each place in order and how you’ll get there — you’ll pick the hotel, tables and tours next. If a leg is a road trip through a region rather than one city, switch it to “Explore.”" />
    {p.dests.length > 1 && <div style={{ fontSize: 12.5, color: t.inkFaint, marginBottom: 12, display: "flex", alignItems: "center", gap: 7 }}><Route size={14} color={t.brass} /> In order of travel — use the arrows to reorder.</div>}
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>{p.dests.map((d, i) => <DestCard key={d.id || i} d={d} i={i} p={p} />)}</div>
    <div style={{ marginTop: 16, display: "flex", flexWrap: "wrap", gap: 12 }}>
      <button onClick={p.addDest} style={{ flex: "1 1 240px", display: "flex", alignItems: "center", gap: 9, background: "none", border: `1px dashed ${t.brassLight}`, borderRadius: 14, padding: "18px 20px", color: t.pine, justifyContent: "center", fontSize: 14.5 }}><Plus size={16} /> {p.dests.length ? "Add another destination" : "Choose your first destination"}</button>
      <button onClick={p.addIdeas} style={{ flex: "1 1 240px", display: "flex", alignItems: "center", gap: 9, background: t.card, border: `1px solid ${t.brass}`, borderRadius: 14, padding: "18px 20px", color: t.pine, justifyContent: "center", fontSize: 14.5 }}><Sparkles size={16} /> Open to suggestions</button>
    </div>
  </div>);
}
function MultiChips({ options, values, onToggle }) {
  return (<div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
    {options.map((o) => { const on = (values || []).includes(o); return <button key={o} onClick={() => onToggle(o)} style={chip(on)}>{o}</button>; })}
  </div>);
}
function IdeasPicker({ d, i, p }) {
  const sel = d.ideaSel || { set: [], act: [], w: [] };
  const setSel = (next) => p.setDest(i, { ideaSel: next });
  const toggle = (group, v) => { const cur = sel[group] || []; setSel({ ...sel, [group]: cur.includes(v) ? cur.filter((x) => x !== v) : [...cur, v] }); };
  const any = (sel.set || []).length + (sel.act || []).length + (sel.w || []).length > 0;
  const matches = any ? IDEAS.filter((x) => matchIdea(x, sel)) : [];
  const drop = any && matches.length === 0 ? nearMiss(sel) : null;
  const Group = ({ label, options, group }) => (<div style={{ marginTop: 16 }}>
    <div style={{ fontSize: 11.5, letterSpacing: "0.16em", textTransform: "uppercase", color: t.inkFaint, marginBottom: 9 }}>{label}</div>
    <MultiChips options={options} values={sel[group]} onToggle={(v) => toggle(group, v)} />
  </div>);
  return (<div style={{ marginTop: 18, background: t.card, borderRadius: 14, padding: "18px 18px 22px" }}>
    <div style={{ fontFamily: font.display, fontSize: 22 }}>What sounds good?</div>
    <div style={{ fontSize: 13.5, color: t.inkSoft, lineHeight: 1.5, maxWidth: 460, marginTop: 3 }}>Tap anything that appeals — mix and match. The more you choose, the sharper the matches.</div>
    <Group label="Type of place" options={IDEA_SETTING} group="set" />
    <Group label="What you'll do" options={IDEA_DOING} group="act" />
    <Group label="Weather" options={IDEA_WEATHER} group="w" />
    {any && (<div style={{ marginTop: 24 }}>
      <div style={{ fontSize: 11.5, letterSpacing: "0.16em", textTransform: "uppercase", color: t.inkFaint, marginBottom: 12 }}>{matches.length} {matches.length === 1 ? "match" : "matches"}</div>
      {matches.map((x) => (<div key={x.n} style={{ background: t.white, border: `1px solid ${t.line}`, borderRadius: 14, padding: "10px 10px 16px", marginBottom: 12, overflow: "hidden" }}>
        <CityHero query={x.n} title={x.n} label={`Best ${x.best}`} h={130} />
        <div style={{ padding: "8px 6px 0", display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: 12 }}>
          <div>
            <div style={{ fontSize: 12.5, color: t.inkSoft, lineHeight: 1.45, maxWidth: 400 }}>{x.why}</div>
            <div style={{ fontSize: 11.5, color: t.brass, marginTop: 6 }}>{[...x.set, ...x.act].slice(0, 3).join(" · ")}</div>
          </div>
          <button onClick={() => p.setDest(i, { city: x.n, mode: regionStops(x.n).length ? "open" : "full" })} style={{ flexShrink: 0, background: t.pine, color: t.paper, border: "none", borderRadius: 999, padding: "10px 18px", display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}><Plus size={15} /> Choose</button>
        </div>
      </div>))}
      {matches.length === 0 && (<div style={{ background: t.white, border: `1px solid ${t.brassLight}`, borderRadius: 14, padding: "16px 18px" }}>
        <div style={{ fontFamily: font.display, fontSize: 19 }}>Nothing fits all of that.</div>
        <div style={{ fontSize: 13, color: t.inkSoft, lineHeight: 1.5, marginTop: 4 }}>
          {drop ? `Everything you tapped can’t be had in one place — drop “${drop}” and matches appear.` : "That combination doesn’t exist in one destination — try releasing a filter, or a different weather."}
        </div>
      </div>)}
    </div>)}
  </div>);
}
function DestCard({ d, i, p }) {
  if (d.mode === "ideas") {
    return (<div style={{ background: t.white, border: `1px solid ${t.brass}`, borderRadius: 16, padding: "22px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 12, color: t.inkFaint, minWidth: 20 }}>{String(i + 1).padStart(2, "0")}</span>
          <Sparkles size={18} color={t.brass} />
          <span style={{ fontFamily: font.display, fontSize: 26 }}>Open to suggestions</span>
        </div>
        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
          <button onClick={() => p.moveDest(i, -1)} disabled={i === 0} style={{ background: "none", border: `1px solid ${t.line}`, borderRadius: 999, width: 30, height: 30, display: "grid", placeItems: "center", color: t.inkSoft, opacity: i === 0 ? 0.3 : 1 }}><ArrowUp size={15} /></button>
          <button onClick={() => p.moveDest(i, 1)} disabled={i === p.dests.length - 1} style={{ background: "none", border: `1px solid ${t.line}`, borderRadius: 999, width: 30, height: 30, display: "grid", placeItems: "center", color: t.inkSoft, opacity: i === p.dests.length - 1 ? 0.3 : 1 }}><ArrowDown size={15} /></button>
          <button onClick={() => p.removeDest(i)} style={{ background: "none", border: "none", color: t.inkFaint, marginLeft: 2 }}><X size={18} /></button>
        </div>
      </div>
      <IdeasPicker d={d} i={i} p={p} />

  }
  return (<div style={{ background: t.white, border: `1px solid ${t.line}`, borderRadius: 16, padding: "22px" }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1 }}>
        <span style={{ fontSize: 12, color: t.inkFaint, minWidth: 20 }}>{String(i + 1).padStart(2, "0")}</span>
        <MapPin size={18} color={t.pine} />
        <div style={{ flex: 1 }}><CityBox value={d.city} onChange={(v) => p.setDest(i, { city: v })} placeholder={d.mode === "open" ? "Region or country (e.g. Portugal)" : "City"} inputStyle={{ fontFamily: font.display, fontSize: 26, color: t.ink, background: "none", border: "none", outline: "none", width: "100%" }} /></div>
      </div>
      <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
        <button onClick={() => p.moveDest(i, -1)} disabled={i === 0} style={{ background: "none", border: `1px solid ${t.line}`, borderRadius: 999, width: 30, height: 30, display: "grid", placeItems: "center", color: t.inkSoft, opacity: i === 0 ? 0.3 : 1 }}><ArrowUp size={15} /></button>
        <button onClick={() => p.moveDest(i, 1)} disabled={i === p.dests.length - 1} style={{ background: "none", border: `1px solid ${t.line}`, borderRadius: 999, width: 30, height: 30, display: "grid", placeItems: "center", color: t.inkSoft, opacity: i === p.dests.length - 1 ? 0.3 : 1 }}><ArrowDown size={15} /></button>
        <button onClick={() => p.removeDest(i)} style={{ background: "none", border: "none", color: t.inkFaint, marginLeft: 2 }}><X size={18} /></button>
      </div>
    </div>
    <div style={{ marginTop: 16 }}><Chips options={MODES} value={d.mode} onChange={(m) => p.setDest(i, { mode: m })} /></div>
    {d.mode === "full" && <div style={{ marginTop: 18 }}><Stepper value={d.nights} onChange={(v) => p.setDest(i, { nights: v })} unit="night" onRemove={() => p.removeDest(i)} removeLabel={`one more minus drops ${d.city || "this stop"}`} /></div>}
    {d.mode === "open" && <div style={{ marginTop: 18, display: "flex", flexWrap: "wrap", gap: 16, alignItems: "center" }}><Stepper value={d.days} onChange={(v) => p.setDest(i, { days: v })} unit="day" max={21} /><span style={{ fontSize: 13.5, color: t.inkSoft, maxWidth: 340 }}>When you build this leg, I’ll ask whether to stay put or roam — then suggest real stops.</span></div>}
    {d.mode === "flights" && <div style={{ marginTop: 16, display: "flex", flexWrap: "wrap", gap: "16px 32px", alignItems: "center" }}><Stepper value={d.nights} onChange={(v) => p.setDest(i, { nights: v })} unit="night" /><span style={{ fontSize: 13, color: t.inkSoft, display: "flex", alignItems: "center", gap: 7 }}><Users size={15} color={t.pine} /> Flights in & out only</span></div>}
    {d.mode !== "ideas" && <div style={{ marginTop: 18 }}><Chips prefix={i === 0 ? "Arrive by" : "Travel here by"} options={ARRIVE} value={d.arriveBy} onChange={(v) => p.setDest(i, { arriveBy: v })} /></div>}
  </div>);
}

function Breakdown({ grand, onRequest, lines, rItems, rT, depart }) {

    <div style={{ fontFamily: font.display, fontSize: 40, marginTop: 6, lineHeight: 1 }}>{fmt(grand)}</div>
    {onRequest > 0 && <div style={{ fontSize: 12, color: "rgba(251,250,246,.7)", marginTop: 4 }}>plus {onRequest} {onRequest === 1 ? "item" : "items"} at rates on request — real prices when booking is connected</div>}
    <div style={{ fontSize: 11.5, color: "rgba(251,250,246,.6)", marginTop: 4 }}>indicative · {depart || "dates TBC"}</div>
    <div style={{ height: 1, background: "rgba(251,250,246,.18)", margin: "16px 0" }} />
    <div style={{ display: "flex", flexDirection: "column", gap: 14, maxHeight: 340, overflowY: "auto" }}>
      {lines.map((c, i) => (<div key={i}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5 }}><span style={{ fontFamily: font.display, fontSize: 18 }}>{c.city}</span><span>{fmt(c.total)}</span></div>
        {c.items.map(([lab, val], k) => <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: "rgba(251,250,246,.65)", marginTop: 3 }}><span style={{ paddingRight: 8 }}>{lab}</span><span style={{ fontStyle: val == null ? "italic" : "normal" }}>{fmtOr(val)}</span></div>)}
      </div>))}
      {rItems.length > 0 && (<div><div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5 }}><span style={{ fontFamily: font.display, fontSize: 18 }}>Home</span><span>{fmt(rT)}</span></div>
        {rItems.map(([lab, val], k) => <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: "rgba(251,250,246,.65)", marginTop: 3 }}><span style={{ paddingRight: 8 }}>{lab}</span><span>{fmt(val)}</span></div>)}
      </div>)}
      {grand === 0 && <div style={{ fontSize: 12.5, color: "rgba(251,250,246,.6)" }}>Make a choice and it appears here.</div>}
    </div>
  </>);
}
function TotalBar({ grand, onRequest, lines, rItems, rT, depart }) {
  const [open, setOpen] = useState(false);
  return (<div className="vo-mobtotal">
    {open && <div style={{ background: t.ink, color: t.paper, padding: "20px 20px 14px", maxHeight: "56vh", overflowY: "auto", borderTop: `1px solid rgba(251,250,246,.15)` }}><Breakdown grand={grand} lines={lines} rItems={rItems} rT={rT} depart={depart} /></div>}
    <button onClick={() => setOpen((o) => !o)} style={{ width: "100%", background: t.ink, color: t.paper, border: "none", borderTop: `1px solid rgba(251,250,246,.15)`, padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <span style={{ fontSize: 12, letterSpacing: "0.16em", textTransform: "uppercase", color: t.brassLight }}>Running total</span>
      <span style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontFamily: font.display, fontSize: 26 }}>{fmt(grand)}</span><ChevronUp size={18} style={{ transform: open ? "rotate(180deg)" : "none", transition: "transform .2s" }} /></span>
    </button>
  </div>);
}

function StepBuild(p) {
  const sch = schedule(p);
  const datesBroken = sch.valid && sch.allowed != null && sch.nights !== sch.allowed && p.dests.length > 0;
  let grand = 0;
  let onRequest = 0;
  const lines = p.dests.map((d, i) => { const from = i === 0 ? p.fromCity : exitPoint(p.dests[i - 1]); const { total, items, onRequest: or } = destCost(d, from); grand += total; onRequest += or || 0; return { city: d.city || `Stop ${i + 1}`, total, items }; });
  const rc = returnCost(p); grand += rc.total;
  return (<div>
    <SectionHead eyebrow="Build your trip" title="Decide as you go" sub="Move down the journey one city at a time. Dates fill in as you set nights, so every table and tour can be booked for a real day." />
    <div style={{ maxWidth: 520, margin: "0 0 26px" }}>
      <div style={{ fontSize: 11.5, letterSpacing: "0.14em", textTransform: "uppercase", color: t.inkFaint, marginBottom: 4 }}>Name this trip</div>
      <TripName p={p} />
      <div style={{ fontSize: 12, color: t.inkFaint, marginTop: 5 }}>Named from your route unless you type your own.</div>
    </div>
    {sch.valid && p.dests.length > 0 && (() => {
      // A running tally of nights, editable in place. This is the "fix it here, don't walk
      // back through every page" tool: each city's nights with +/- right on the summary, and
      // the total measured against what the dates actually allow.
      const allowed = sch.allowed;
      const over = allowed != null && sch.nights > allowed;
      const under = allowed != null && sch.nights < allowed;
      const bad = over || under;
      return (<div style={{ background: bad ? "#FBEEE9" : t.card, border: `1px solid ${bad ? "#D9A08B" : t.line}`, borderRadius: 14, padding: "14px 16px", marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: bad ? 8 : 0 }}>
          <div style={{ fontSize: 11.5, letterSpacing: "0.14em", textTransform: "uppercase", color: bad ? "#B0563A" : t.inkFaint }}>Nights across the trip</div>
          <div style={{ fontSize: 13, color: t.ink }}>
            <strong>{sch.nights}</strong> planned{allowed != null ? <> · <strong>{allowed}</strong> your dates allow</> : null}
            {over ? <span style={{ color: "#B0563A" }}>{`  · ${sch.nights - allowed} too many`}</span> : under ? <span style={{ color: "#B0563A" }}>{`  · ${allowed - sch.nights} short`}</span> : allowed != null ? <span style={{ color: t.pine }}>  · matches</span> : null}
          </div>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {p.dests.map((d, i) => (<div key={"ns" + i} style={{ display: "flex", alignItems: "center", gap: 6, background: t.white, border: `1px solid ${t.line}`, borderRadius: 999, padding: "5px 6px 5px 12px" }}>
            <span style={{ fontSize: 13, color: t.ink, maxWidth: 130, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{bareCity(d.city) || `Stop ${i + 1}`}</span>
            {/* At one night the minus used to clamp and do nothing, which reads as broken —
                and this is the only nights control on the Build step, so there was no way to
                drop a city without going back a screen. Going below one night means "not here
                at all", so it removes the stop. Recoverable: removeDest leaves an undo. */}
            <button title={destNights(d) <= 1 ? `Remove ${bareCity(d.city) || "this stop"}` : "One night fewer"}
              onClick={() => {
                const cur = destNights(d);
                if (cur <= 1) { p.removeDest(i); return; }
                p.setDest(i, d.mode === "open" ? { days: cur - 1 } : { nights: cur - 1 });
              }} style={{ width: 24, height: 24, borderRadius: 999, border: `1px solid ${t.line}`, background: t.white, color: destNights(d) <= 1 ? t.brass : t.ink, fontSize: 15, lineHeight: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
            <span style={{ fontSize: 13, minWidth: 16, textAlign: "center", color: t.ink }}>{destNights(d)}</span>
            <button onClick={() => { const cur = destNights(d); const nn = cur + 1; p.setDest(i, d.mode === "open" ? { days: nn } : { nights: nn }); }} style={{ width: 24, height: 24, borderRadius: 999, border: `1px solid ${t.line}`, background: t.white, color: t.ink, fontSize: 15, lineHeight: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
          </div>))}
        </div>
        {bad && <div style={{ fontSize: 12.5, color: t.inkSoft, lineHeight: 1.5, marginTop: 9 }}>{over
          ? "Trim a night above, or push your return date back — otherwise a hotel or a flight lands on the wrong day."
          : "Add a night above, or bring your return forward — otherwise a night of the trip has nowhere to sleep."} You can also <button onClick={() => p.setStep(0)} style={{ background: "none", border: "none", color: t.pine, textDecoration: "underline", padding: 0, fontSize: 12.5, cursor: "pointer" }}>change the dates</button>.</div>}
      </div>);
    })()}
    <div className="vo-build">
      <div className="vo-main" style={{ display: "flex", flexDirection: "column", gap: 22 }}>
        {p.dests.length === 0 && <div style={{ color: t.inkFaint, padding: "30px 0" }}>Go back and add at least one destination to start pricing.</div>}
        {p.dests.map((d, i) => <CitySection key={d.id || i} d={d} i={i} p={p} from={i === 0 ? p.fromCity : exitPoint(p.dests[i - 1])} legSched={sch.legs[i]} />)}
        {p.dests.length > 0 && <ReturnSection p={p} rc={rc} blocked={datesBroken} />}
        {p.dests.length > 0 && (datesBroken ? (<div style={{ marginTop: 6, background: "#FBEEE9", border: "1px solid #D9A08B", borderRadius: 16, padding: "18px 20px", display: "flex", gap: 11, alignItems: "flex-start" }}>
          <AlertTriangle size={17} color="#B0563A" style={{ marginTop: 2, flexShrink: 0 }} />
          <div>
            <div style={{ fontFamily: font.display, fontSize: 20, color: t.ink }}>Your nights and your dates disagree</div>
            <div style={{ fontSize: 13.5, color: t.inkSoft, lineHeight: 1.5, marginTop: 4 }}>{sch.nights} {sch.nights === 1 ? "night" : "nights"} booked against {sch.allowed} available. Fix that before booking anything — otherwise you fly out with a hole in the trip, or a hotel you never reach. Adjust a stay above, or change your dates.</div>
            <button onClick={() => p.setStep(0)} style={{ marginTop: 12, background: "none", border: `1px solid ${t.line}`, borderRadius: 999, padding: "9px 18px", color: t.ink, fontSize: 13 }}>Change the dates</button>
          </div>
        </div>) : <button onClick={p.onItinerary} style={{ marginTop: 6, background: t.pine, color: t.paper, border: "none", borderRadius: 999, padding: "15px 30px", display: "flex", alignItems: "center", justifyContent: "center", gap: 10, fontSize: 15 }}><ScrollText size={17} /> View full itinerary</button>)}
      </div>
      <div className="vo-side">
        <div className="vo-sidecard" style={{ background: t.ink, color: t.paper, borderRadius: 18, padding: "22px 20px" }}>
          <Breakdown grand={grand} onRequest={onRequest} lines={lines} rItems={rc.items} rT={rc.total} depart={p.dates.depart} />
        </div>
      </div>
    </div>
    <TotalBar grand={grand} onRequest={onRequest} lines={lines} rItems={rc.items} rT={rc.total} depart={p.dates.depart} />
  </div>);
}

// Flights are the one thing we will not invent. We do not sell them, we earn nothing on
// them, and a made-up airline is worse than no airline. So: tell the truth about the
// route, send her to a real search, and let her record what she actually booked.
function iataFor(city) { const a = airportFor(city); return a ? a.code : null; }
function flightSearchUrl(from, to, date, cabin) {

        if (pk.transfer) rows.push(<ItinLine key="tr" label={`${pk.transfer.mode} from ${gatewayFor(d.city) ? gatewayFor(d.city).air : "the airport"}`} sub="both ways" price={pk.transfer.price * 2} />);
        if (pk.stay) rows.push(<ItinLine key="s" label={pk.stay.name || pk.stay.level} sub={`${d.days} nights · ${pk.stay.level}`} price={pk.stay.nightly != null ? pk.stay.nightly * d.days : null} />);
        (pk.dines || []).forEach((x, k) => rows.push(<ItinLine key={"d" + k} label={x.name || "Dining"} sub={x.date ? fmtDay(new Date(x.date + "T00:00:00")) : "dining · date TBC"} price={x.price} />));
        (pk.sports || []).forEach((x, k) => rows.push(<ItinLine key={"spb" + k} label={x.name} sub={x.date ? fmtDay(new Date(x.date + "T00:00:00")) : "sport · date TBC"} price={x.price} />));
        (pk.days || []).forEach((x, k) => {
          rows.push(<ItinLine key={"dt" + k} label={x.name} sub={x.date ? fmtDay(new Date(x.date + "T00:00:00")) : "day out · date TBC"} price={x.price} />);
          (x.dines || []).forEach((dn, j) => rows.push(<ItinLine key={"dtd" + k + j} label={dn.name || "Dining"} sub={dn.date ? `${fmtDay(new Date(dn.date + "T00:00:00"))} · in ${x.town}` : `in ${x.town} · date TBC`} price={dn.price} />));
        });
      } else if (pk.exploreMode === "roam") {
        (pk.stops || []).forEach((st, k) => {
          const ss = sch.legs[i] && sch.legs[i].stops[k];
          const prev = k === 0 ? (gatewayFor(d.city) ? gatewayFor(d.city).air : from) : pk.stops[k - 1].name;
          const link = prev ? connection(prev, st.name) : null;
          rows.push(<div key={"st" + k} style={{ marginTop: k ? 14 : 0 }}>
            {link && <div style={{ fontSize: 11.5, color: t.brass, display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>{link.mode === "Ferry" ? <Ship size={12} /> : <Route size={12} />} {prev} → {st.name} · {link.label}{link.km ? ` · ${link.km} km` : ""}</div>}
            <div style={{ fontFamily: font.display, fontSize: 19, color: t.pine }}>{st.name}{ss ? <span style={{ fontFamily: font.ui, fontSize: 11.5, color: t.inkFaint, marginLeft: 8 }}>{fmtDay(ss.arrive)} – {fmtDay(ss.depart)}</span> : null}</div>
          </div>);
          if (st.stay) rows.push(<ItinLine key={"ss" + k} label={st.stay.name || st.stay.level} sub={`${st.nights || 1} nights · ${st.stay.level}`} price={st.stay.nightly != null ? st.stay.nightly * (st.nights || 1) : null} />);
          (st.dines || []).forEach((x, j) => rows.push(<ItinLine key={"sd" + k + j} label={x.name || "Dining"} sub={x.date ? fmtDay(new Date(x.date + "T00:00:00")) : "dining · date TBC"} price={x.price} />));
        });
      } else rows.push(<div key="none" style={{ fontSize: 13, color: t.inkFaint }}>Not yet decided.</div>);
    } else {
      if (pk.onward) rows.push(<ItinLine key="ow" label={`${pk.onward.mode} · ${pk.hub} → ${d.city}`} sub={pk.onward.label} price={pk.onward.price} />);
      if (pk.transfer) rows.push(<ItinLine key="tr" label={`${pk.transfer.mode} from ${gatewayFor(d.city) ? gatewayFor(d.city).air : "the airport"}`} sub="both ways" price={pk.transfer.price * 2} />);
      if (pk.stay) rows.push(<ItinLine key="s" label={pk.stay.name || pk.stay.level} sub={`${destNights(d)} nights · ${pk.stay.level}`} price={pk.stay.nightly * destNights(d)} />);
      (pk.dines || []).forEach((x, k) => rows.push(<ItinLine key={"d" + k} label={x.name || "Dining"} sub={x.date ? fmtDay(new Date(x.date + "T00:00:00")) : "dining · date TBC"} price={x.price} />));
      (pk.spas || []).forEach((x, k) => rows.push(<ItinLine key={"sp" + k} label={x.name} sub="spa" price={x.price} />));
      (pk.tours || []).forEach((x, k) => rows.push(<ItinLine key={"tr" + k} label={x.name} sub={x.date ? fmtDay(new Date(x.date + "T00:00:00")) : "tour · date TBC"} price={x.price} />));
      (pk.sports || []).forEach((x, k) => rows.push(<ItinLine key={"sp2" + k} label={x.name} sub={x.date ? fmtDay(new Date(x.date + "T00:00:00")) : "sport · date TBC"} price={x.price} />));
    }
    const ls = sch.legs[i];
    const baseMeta = d.mode === "open" ? `${d.days}-day explore` : d.mode === "flights" ? `${destNights(d)} nights · flights only` : `${destNights(d)} nights`;
    const meta = ls ? `${fmtDay(ls.arrive)} – ${fmtDay(ls.depart)} · ${baseMeta}` : baseMeta;
    if (d.mode === "open" && pk.exploreMode === "roam" && (pk.stops || []).length) { (pk.stops || []).forEach((st, k) => mapPoints.push({ name: st.name, when: ls && ls.stops[k] ? fmtShort(ls.stops[k].arrive) : "" })); }
    else if (d.mode === "open" && pk.baseTown) mapPoints.push({ name: pk.baseTown, when: ls ? fmtShort(ls.arrive) : "" });
    else if (d.mode === "open") { const gw = gatewayFor(d.city); const where = gw ? gw.air : d.city; if (where) mapPoints.push({ name: where, when: ls ? fmtShort(ls.arrive) : "" }); }
    else if (d.city) mapPoints.push({ name: d.city, when: ls ? fmtShort(ls.arrive) : "" });
    // Is a marquee event on while they're in this city? Real dates, matched to the stay.
    if (ls && d.city) {
      const evs = eventsFor(d.city, ls.arrive.toISOString().slice(0, 10), ls.depart.toISOString().slice(0, 10));
      evs.forEach((ev, k) => {
        const evS = new Date(ev.start + "T00:00:00"), evE = new Date(ev.end + "T00:00:00");
        rows.push(<div key={"ev" + k} style={{ marginTop: 12, background: t.mist, border: `1px solid ${t.brass}`, borderRadius: 12, padding: "13px 15px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 4 }}>
            <Trophy size={14} color={t.brass} />
            <span style={{ fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", color: t.brass }}>On while you're here</span>
          </div>
          <div style={{ fontFamily: font.display, fontSize: 18, color: t.ink, lineHeight: 1.25 }}>{ev.name}</div>
          <div style={{ fontSize: 12, color: t.inkSoft, marginTop: 2 }}>{fmtShort(evS)} – {fmtShort(evE)}, {d.city}</div>
          <div style={{ fontSize: 13, color: t.inkSoft, lineHeight: 1.5, marginTop: 5 }}>{ev.note}</div>
        </div>);
      });
    }
    const nextD = p.dests[i + 1];
    const leaveFrom = exitPoint(d);
    const nextTarget = nextD ? (gatewayFor(nextD.city) ? gatewayFor(nextD.city).air : nextD.city) : (p.returnFrom || "");
    const onward = leaveFrom && nextTarget && !sameCity(leaveFrom, nextTarget) ? connection(leaveFrom, nextTarget) : null;
    if (onward) rows.push(<div key="onward" style={{ marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${t.line}`, fontSize: 11.5, color: t.brass, display: "flex", alignItems: "center", gap: 6 }}>{onward.mode === "Ferry" ? <Ship size={12} /> : <Route size={12} />} On to {nextTarget} · {onward.label}{onward.km ? ` · ${onward.km} km` : ""}</div>);
    else if (nextTarget && leaveFrom && !sameCity(leaveFrom, nextTarget)) rows.push(<div key="onward" style={{ marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${t.line}`, fontSize: 11.5, color: t.brass, display: "flex", alignItems: "center", gap: 6 }}><Plane size={12} /> On to {nextTarget} · by air</div>);
    return <ItinLeg key={i} n={i + 1} title={d.city || `Stop ${i + 1}`} meta={meta}>{rows.length ? rows : <div style={{ fontSize: 13, color: t.inkFaint }}>Nothing selected yet.</div>}</ItinLeg>;
  });
  const rc = returnCost(p); grand += rc.total;
  const route = [p.fromCity, ...p.dests.map((d) => d.city), p.homeCity].filter(Boolean).join("  ·  ");
  return (<div className="vo-fade" style={{ minHeight: "100vh" }}>
    <header className="vo-noprint" style={{ position: "sticky", top: 0, zIndex: 20, background: t.paper, borderBottom: `1px solid ${t.line}`, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px clamp(20px,5vw,48px)" }}>
      <button onClick={p.onEdit} style={{ background: "none", border: `1px solid ${t.line}`, borderRadius: 999, padding: "10px 18px", color: t.ink, display: "flex", alignItems: "center", gap: 8, fontSize: 13.5 }}><Pencil size={15} /> Edit</button>
      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={() => { if (typeof window !== "undefined") window.print(); }} style={{ background: "none", border: `1px solid ${t.line}`, borderRadius: 999, padding: "10px 18px", color: t.ink, fontSize: 13.5 }}>Print / Save PDF</button>
        <SignInBadge user={p.user} authReady={p.authReady} onOpen={p.onOpenAuth} onSignOut={p.onSignOut} />
        <button onClick={p.onHome} style={{ background: "none", border: "none", color: t.inkFaint, display: "flex", alignItems: "center", gap: 6, fontSize: 13.5 }}><Home size={15} /> Home</button>
      </div>
    </header>
    <div style={{ maxWidth: 760, margin: "0 auto", padding: "0 clamp(22px,5vw,56px) 100px" }}>
      <div className="vo-hero" style={{ position: "relative", height: 240, borderRadius: 18, overflow: "hidden", marginTop: 24 }}>
        <Photo query={heroPlace(p)} h={240} radius={0} />
        <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(34,29,25,.55), rgba(34,29,25,.15))" }} />
      </div>
      <div style={{ textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: 16, padding: "40px 0", borderBottom: `1px solid ${t.line}` }}>
        <Eyebrow>Voyage One · Private Itinerary</Eyebrow>
        {/* Only ever show a name she typed herself. The auto-generated one collapsed a
            six-city trip to "Rome to Milan", which reads as the whole itinerary and is
            wrong — the real route is the line of cities below. A generated summary that
            contradicts the thing under it is worse than no summary. */}
        {p.tripName ? <div style={{ fontFamily: font.display, fontSize: 22, color: t.brass, letterSpacing: "0.02em" }}>{p.tripName}</div> : null}
        <h1 style={{ fontFamily: font.display, fontWeight: 400, margin: 0, fontSize: "clamp(34px,6vw,58px)", lineHeight: 1.05 }}>Curated for<br />{nameLine(p.travelers)}</h1>
        <Rule w={56} />
        <div style={{ fontSize: 14, letterSpacing: "0.06em", color: t.inkSoft }}>{fmtRange(p.dates.depart, p.dates.ret)}</div>
        {route && <div style={{ fontSize: 12.5, letterSpacing: "0.14em", textTransform: "uppercase", color: t.inkFaint, maxWidth: 560, lineHeight: 1.8 }}>{route}</div>}
      </div>
      <ExpertPanel p={p} sch={sch} />
      {mapPoints.length > 0 && (() => {
        // The journey starts where you leave from and ends where you land — always show
        // both. Hiding a far-away origin was why the map had no real beginning or end.
        const start = p.fromCity
          ? [{ name: p.fromCity, when: p.dates.depart ? fmtShort(new Date(p.dates.depart + "T00:00:00")) : "start" }] : [];
        const lastNamed = mapPoints[mapPoints.length - 1].name;
        // If you travel to a different airport city to fly out, that is part of the journey too.
        const exitLeg = p.returnFrom && !sameCity(p.returnFrom, lastNamed)
          ? [{ name: p.returnFrom, when: "fly out" }] : [];
        const backHome = p.homeCity
          ? [{ name: p.homeCity, when: "home" }] : [];
        const pts = [...start, ...mapPoints, ...exitLeg, ...backHome];
        return <div style={{ marginTop: 30 }}><JourneyMap points={pts} /></div>;
      })()}
      <div style={{ marginTop: 40 }}>
        {legEls}
        {(rc.items.length > 0 || p.homeCity) && (<ItinLeg n={<Home size={15} />} title="Heading home" meta={p.homeCity ? `to ${p.homeCity}` : ""}>
          {rc.needLeg && p.returnPick.ground && <ItinLine label={`${p.returnMode} to ${p.returnFrom}`} price={p.returnPick.ground.price} />}
          {!p.returnFrom && p.returnPick.homeTransfer && <ItinLine label={`${p.returnPick.homeTransfer.mode} to the airport`} sub="no airport in your last town — transfer to the nearest one, then fly" price={p.returnPick.homeTransfer.price} />}
          {p.returnPick.flight && <ItinLine label={`Fly · ${p.returnPick.flight.airline || "airline TBC"}${p.returnPick.flight.flightNo ? " " + p.returnPick.flight.flightNo : ""}`} sub={`${p.returnPick.flight.cabin || "cabin TBC"}${p.returnPick.flight.depart ? " · departs " + p.returnPick.flight.depart : ""}${p.returnPick.flight.totalMin ? ` · ${Math.floor(p.returnPick.flight.totalMin / 60)}h ${p.returnPick.flight.totalMin % 60}m total` : ""}`} price={p.returnPick.flight.price != null ? p.returnPick.flight.price : null} />}
          {rc.items.length === 0 && <div style={{ fontSize: 13, color: t.inkFaint }}>Flight home not yet chosen.</div>}
        </ItinLeg>)}
      </div>
      {p.returnFrom && p.homeCity && (() => { const dt = departTime(p.returnFrom, p.homeCity); const end = sch.end;
        return (<div style={{ marginTop: 22, background: t.card, borderRadius: 16, padding: "18px 20px" }}>
          <div style={{ fontSize: 10.5, letterSpacing: "0.18em", textTransform: "uppercase", color: t.inkFaint }}>Home</div>
          <div style={{ fontFamily: font.display, fontSize: 22, marginTop: 4 }}>{p.returnFrom} → {p.homeCity}</div>
          <div style={{ fontSize: 13, color: t.inkSoft, marginTop: 3 }}>{end ? fmtDay(end) : "date TBC"}{dt ? ` · departs about ${dt.time}` : ""}{rp && rp.flight && rp.flight.airline ? ` · ${rp.flight.airline}, ${rp.flight.cabin || "cabin TBC"}` : " · flight not chosen"}</div>
          {dt && <div style={{ fontSize: 12, color: t.inkFaint, marginTop: 5, lineHeight: 1.5 }}>{dt.note}</div>}
        </div>); })()}
      <PrepPanel p={p} />
      <div style={{ marginTop: 20, background: t.ink, color: t.paper, borderRadius: 18, padding: "26px 26px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div><Eyebrow color={t.brassLight}>Estimated total</Eyebrow><div style={{ fontSize: 12, color: "rgba(251,250,246,.6)", marginTop: 6 }}>Indicative — final on booking</div></div>
        <div style={{ fontFamily: font.display, fontSize: 46, lineHeight: 1 }}>{fmt(grand)}</div>
      </div>
      {!p.user && <SaveJourneyPrompt onOpen={p.onOpenAuth} />}
      <div style={{ textAlign: "center", marginTop: 26, fontSize: 11.5, letterSpacing: "0.14em", textTransform: "uppercase", color: t.inkFaint }}>Voyage One · Private Travel Atelier</div>
    </div>
  </div>);
}

createRoot(document.getElementById("root")).render(<VoyageOne />);

</script>
</body>
</html>
